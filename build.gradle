plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases' }
	maven { name = 'Ladysnake'; url = 'https://maven.ladysnake.org/releases' }
	maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
	maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

loom {
	mods {
		"hollowsovereign" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu — optional at runtime, only used for the settings screen entry
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Satin API — post-processing shaders (bloom). Soft dependency, guarded at runtime.
	modImplementation "org.ladysnake:satin:${project.satin_version}"

	// GeckoLib — animated 3D models. Use the OFFICIAL maven with the version-specific
	// artifact name (the Modrinth maven's "geckolib:4.8.4" is ambiguous and served a 1.21 jar).
	modImplementation "software.bernie.geckolib:geckolib-fabric-1.20.1:${project.geckolib_version}"

	// NOTE: Iris + Sodium are NOT loaded in the dev environment — they crash Loom's
	// patched-LWJGL dev client. Install them (and a shaderpack) in a real launcher
	// instance instead; see README "Playing with shaders".
}

processResources {
	def props = ["version": version]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
